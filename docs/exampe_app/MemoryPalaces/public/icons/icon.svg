<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a1a2e"/>

  <!-- Outer accent circle -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#4a90e2" stroke-width="8"/>

  <!-- Palace base/foundation -->
  <rect x="80" y="320" width="352" height="40" fill="#4a90e2" rx="4"/>

  <!-- Left pillar -->
  <g>
    <rect x="100" y="200" width="30" height="120" fill="#ffffff"/>
    <rect x="95" y="195" width="40" height="8" fill="#4a90e2"/>
    <rect x="95" y="320" width="40" height="8" fill="#4a90e2"/>
  </g>

  <!-- Second pillar from left -->
  <g>
    <rect x="160" y="180" width="30" height="140" fill="#ffffff"/>
    <rect x="155" y="175" width="40" height="8" fill="#4a90e2"/>
    <rect x="155" y="320" width="40" height="8" fill="#4a90e2"/>
  </g>

  <!-- Center pillar (tallest) -->
  <g>
    <rect x="241" y="140" width="30" height="180" fill="#ffffff"/>
    <rect x="236" y="135" width="40" height="8" fill="#4a90e2"/>
    <rect x="236" y="320" width="40" height="8" fill="#4a90e2"/>
  </g>

  <!-- Second pillar from right -->
  <g>
    <rect x="322" y="180" width="30" height="140" fill="#ffffff"/>
    <rect x="317" y="175" width="40" height="8" fill="#4a90e2"/>
    <rect x="317" y="320" width="40" height="8" fill="#4a90e2"/>
  </g>

  <!-- Right pillar -->
  <g>
    <rect x="382" y="200" width="30" height="120" fill="#ffffff"/>
    <rect x="377" y="195" width="40" height="8" fill="#4a90e2"/>
    <rect x="377" y="320" width="40" height="8" fill="#4a90e2"/>
  </g>

  <!-- Roof/pediment -->
  <polygon points="256,100 100,180 412,180" fill="#4a90e2"/>

  <!-- Central decorative triangle -->
  <polygon points="256,120 220,170 292,170" fill="#1a1a2e" opacity="0.8"/>

  <!-- Memory symbol - interconnected dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="250" r="4"/>
    <circle cx="256" cy="200" r="4"/>
    <circle cx="362" cy="250" r="4"/>
    <line x1="150" y1="250" x2="256" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="200" x2="362" y2="250" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
