 <svg
      xmlns="http://www.w3.org/2000/svg"
      width="512"
      height="512"
      viewBox="0 0 24 24"
      fill="none"
    >
      <defs>
        <radialGradient id="brand-bg" cx="42%" cy="38%" r="70%" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#1e1b4b" />
          <stop offset="52%" stopColor="#0f172a" />
          <stop offset="100%" stopColor="#160b33" />
        </radialGradient>
      </defs>
      <rect width="24" height="24" fill="url(#brand-bg)" />

      {/* ── Side column lines ──jjj */}
      <path d="M4,5 L4.5,19" stroke="#818cf8" strokeWidth="0.6" strokeOpacity="0.4" strokeLinecap="round" />
      <path d="M20,5 L19.5,19" stroke="#818cf8" strokeWidth="0.6" strokeOpacity="0.4" strokeLinecap="round" />

      {/* ── Top-arch edge lines (palace crown) ── */}
      <path d="M4,5 L8.5,2.5" stroke="#a78bfa" strokeWidth="0.75" strokeOpacity="0.65" strokeLinecap="round" />
      <path d="M8.5,2.5 L12,1.8" stroke="#a78bfa" strokeWidth="0.75" strokeOpacity="0.65" strokeLinecap="round" />
      <path d="M12,1.8 L15.5,2.5" stroke="#a78bfa" strokeWidth="0.75" strokeOpacity="0.65" strokeLinecap="round" />
      <path d="M15.5,2.5 L20,5" stroke="#a78bfa" strokeWidth="0.75" strokeOpacity="0.65" strokeLinecap="round" />

      {/* ── Spoke lines: every node → central hub ── */}
      <path d="M4,5 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M8.5,2.5 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M12,1.8 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M15.5,2.5 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M20,5 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M4.5,19 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />
      <path d="M19.5,19 L12,12" stroke="#818cf8" strokeWidth="0.65" strokeOpacity="0.5" strokeLinecap="round" />

      {/* ── Arch nodes (palace crown) ── */}
      <circle cx="4" cy="5" r="1.45" fill="#7c3aed" />
      <circle cx="8.5" cy="2.5" r="1.15" fill="#a78bfa" />
      <circle cx="12" cy="1.8" r="1.55" fill="#8b5cf6" />
      <circle cx="15.5" cy="2.5" r="1.15" fill="#a78bfa" />
      <circle cx="20" cy="5" r="1.45" fill="#7c3aed" />

      {/* ── Base anchor nodes ── */}
      <circle cx="4.5" cy="19" r="1.55" fill="#2563eb" />
      <circle cx="19.5" cy="19" r="1.55" fill="#2563eb" />

      {/* ── Central hub: 4-ring glow ── */}
      <circle cx="12" cy="12" r="4.4" fill="#312e81" fillOpacity="0.45" />
      <circle cx="12" cy="12" r="3.1" fill="#312e81" />
      <circle cx="12" cy="12" r="2.1" fill="#4338ca" />
      <circle cx="12" cy="12" r="1.2" fill="#818cf8" />
      <circle cx="12" cy="12" r="0.55" fill="#e0e7ff" />
    </svg>